; Lamp meshes are split out of the body by blender/scripts/details_ref.py (split_lamps).
; Vanilla AC cannot drive tail and brake on one mesh, so the tail lamp's red section is split:
; upper band = tail light (with the headlights), lower band = brake light. Colours: ESTIMATE (format as adc_bmw_e46).
[HEADER]
VERSION=3

[LIGHT_0]
NAME=DET_LAMP_HEAD
COLOR=80,80,70

[LIGHT_1]
NAME=DET_LAMP_TAIL
COLOR=40,1,0

[BRAKE_0]
NAME=DET_LAMP_BRAKE
COLOR=150,8,0
OFF_COLOR=0,0,0
